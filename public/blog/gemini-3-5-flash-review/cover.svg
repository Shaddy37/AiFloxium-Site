<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="0" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="0.5"/>
  </g>
  
  <!-- Radial glow -->
  <circle cx="900" cy="300" r="400" fill="url(#glow)"/>
  
  <!-- Category label -->
  <rect x="120" y="120" width="180" height="28" rx="4" fill="url(#accent)"/>
  <text x="135" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="0.15em">AI MODEL REVIEW</text>
  
  <!-- Main headline -->
  <text x="120" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="white" letter-spacing="-0.03em">Gemini 3.5</text>
  <text x="120" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="white" letter-spacing="-0.03em">Flash Review</text>
  
  <!-- Supporting line -->
  <text x="120" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#a1a1aa" letter-spacing="0.02em">Speed, Benchmarks &amp; Honest Verdict</text>
  
  <!-- Score badge -->
  <g transform="translate(950, 150)">
    <circle cx="80" cy="80" r="75" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="80" cy="80" r="75" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="352" stroke-dashoffset="70" transform="rotate(-90 80 80)"/>
    <text x="80" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">4.2</text>
    <text x="80" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a1a1aa" text-anchor="middle">/5</text>
  </g>
  
  <!-- Key specs -->
  <g transform="translate(120, 420)">
    <rect x="0" y="0" width="200" height="70" rx="8" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="white">~280</text>
    <text x="115" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa">tokens/s</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#71717a">Output Speed</text>
  </g>
  
  <g transform="translate(340, 420)">
    <rect x="0" y="0" width="200" height="70" rx="8" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="white">1M</text>
    <text x="65" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa">tokens</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#71717a">Context Window</text>
  </g>
  
  <g transform="translate(560, 420)">
    <rect x="0" y="0" width="200" height="70" rx="8" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="white">83.6%</text>
    <text x="120" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa">MCP</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#71717a">Atlas Score</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="120" y="530" width="100" height="3" rx="1.5" fill="url(#accent)"/>
  
  <!-- Brand watermark -->
  <text x="1080" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="white" fill-opacity="0.3" text-anchor="end" letter-spacing="0.1em">AIFLOXIUM</text>
</svg>