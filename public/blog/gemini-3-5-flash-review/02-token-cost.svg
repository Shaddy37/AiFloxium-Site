<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .text { font-family: 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive; }
      .line { fill: none; stroke: #1a1a1a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .label { font-family: 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive; font-size: 14px; fill: #1a1a1a; font-weight: bold; }
      .label-sm { font-family: 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive; font-size: 11px; fill: #666; }
      .label-orange { font-family: 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive; font-size: 14px; fill: #f97316; font-weight: bold; }
      .label-red { font-family: 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive; font-size: 13px; fill: #ef4444; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="white"/>
  
  <!-- Title -->
  <text x="600" y="80" class="label" text-anchor="middle" font-size="20">The Token Cost Problem</text>
  <text x="600" y="105" class="label-sm" text-anchor="middle" font-size="13">3x price = 5.5x real cost</text>
  
  <!-- Scale base -->
  <line x1="600" y1="550" x2="600" y2="300" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="500" y1="550" x2="700" y2="550" stroke="#1a1a1a" stroke-width="4"/>
  
  <!-- Scale beam -->
  <line x1="350" y1="280" x2="850" y2="280" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Left pan (cheap - Gemini 3 Flash) -->
  <g transform="translate(350, 280)">
    <line x1="0" y1="0" x2="-60" y2="80" class="line"/>
    <line x1="0" y1="0" x2="60" y2="80" class="line"/>
    <path d="M -80 80 Q -60 100 -40 80 Q -20 100 0 80 Q 20 100 40 80 Q 60 100 80 80" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Small stack of tokens -->
    <rect x="-25" y="50" width="50" height="15" rx="3" fill="#e5e5e5" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="-20" y="35" width="40" height="15" rx="3" fill="#e5e5e5" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="-15" y="20" width="30" height="15" rx="3" fill="#e5e5e5" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>
  
  <!-- Right pan (expensive - Gemini 3.5 Flash) -->
  <g transform="translate(850, 280)">
    <line x1="0" y1="0" x2="-60" y2="80" class="line"/>
    <line x1="0" y1="0" x2="60" y2="80" class="line"/>
    <path d="M -80 80 Q -60 100 -40 80 Q -20 100 0 80 Q 20 100 40 80 Q 60 100 80 80" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Big stack of tokens -->
    <rect x="-35" y="60" width="70" height="18" rx="3" fill="#f97316" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="-30" y="40" width="60" height="18" rx="3" fill="#f97316" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="-25" y="20" width="50" height="18" rx="3" fill="#f97316" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="-20" y="0" width="40" height="18" rx="3" fill="#f97316" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="-15" y="-20" width="30" height="18" rx="3" fill="#f97316" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>
  
  <!-- Labels -->
  <text x="350" y="420" class="label" text-anchor="middle">$278</text>
  <text x="350" y="440" class="label-sm" text-anchor="middle">Gemini 3 Flash</text>
  
  <text x="850" y="420" class="label-red" text-anchor="middle">$1,551</text>
  <text x="850" y="440" class="label-sm" text-anchor="middle">Gemini 3.5 Flash</text>
  
  <!-- Xiaohei standing between scales looking worried -->
  <g transform="translate(600, 480)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="35" ry="40" fill="#1a1a1a"/>
    <!-- Eyes worried -->
    <circle cx="-10" cy="-12" r="4" fill="white"/>
    <circle cx="10" cy="-12" r="4" fill="white"/>
    <!-- Worried mouth -->
    <path d="M -8 5 Q 0 12 8 5" fill="none" stroke="white" stroke-width="2"/>
    <!-- Legs -->
    <line x1="-15" y1="38" x2="-18" y2="65" class="line"/>
    <line x1="15" y1="38" x2="18" y2="65" class="line"/>
    <!-- Hands up in confusion -->
    <line x1="-35" y1="-5" x2="-55" y2="-25" class="line"/>
    <line x1="35" y1="-5" x2="55" y2="-25" class="line"/>
  </g>
  
  <!-- Annotation -->
  <text x="600" y="580" class="label-red" text-anchor="middle">5.5x more expensive in practice</text>
  
  <!-- Thinking tokens annotation -->
  <g transform="translate(950, 200)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="#fef3c7" stroke="#f97316" stroke-width="1.5"/>
    <text x="90" y="25" class="label-orange" text-anchor="middle" font-size="12">Thinking tokens</text>
    <text x="90" y="45" class="label-sm" text-anchor="middle" font-size="10">+ output tokens = $$$</text>
  </g>
  
  <!-- Arrow from thinking tokens to scale -->
  <path d="M 950 230 Q 900 260 870 280" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3"/>
</svg>