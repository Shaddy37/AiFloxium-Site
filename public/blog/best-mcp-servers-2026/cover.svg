<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="0" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="0.5"/>
  </g>
  
  <!-- Radial glow -->
  <circle cx="900" cy="300" r="400" fill="url(#glow)"/>
  
  <!-- Category label -->
  <rect x="120" y="120" width="200" height="28" rx="4" fill="url(#accent)"/>
  <text x="135" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="0.15em">DEVELOPER TOOLS</text>
  
  <!-- Main headline -->
  <text x="120" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" fill="white" letter-spacing="-0.03em">Best MCP Servers</text>
  <text x="120" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" fill="white" letter-spacing="-0.03em">2026</text>
  
  <!-- Supporting line -->
  <text x="120" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#a1a1aa" letter-spacing="0.02em">50+ servers reviewed. 3-7 you actually need.</text>
  
  <!-- Server count badge -->
  <g transform="translate(950, 140)">
    <circle cx="80" cy="80" r="75" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="white" text-anchor="middle">38K+</text>
    <text x="80" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle">servers</text>
  </g>
  
  <!-- Key stats -->
  <g transform="translate(120, 410)">
    <rect x="0" y="0" width="180" height="70" rx="8" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="white">#1</text>
    <text x="55" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa">global</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#71717a">Playwright</text>
  </g>
  
  <g transform="translate(320, 410)">
    <rect x="0" y="0" width="180" height="70" rx="8" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="white">36.7%</text>
    <text x="120" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa">SSRF</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#71717a">Security risk</text>
  </g>
  
  <g transform="translate(520, 410)">
    <rect x="0" y="0" width="180" height="70" rx="8" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="white">3-7</text>
    <text x="75" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa">max</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#71717a">Recommended</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="120" y="530" width="100" height="3" rx="1.5" fill="url(#accent)"/>
  
  <!-- Brand watermark -->
  <text x="1080" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="white" fill-opacity="0.3" text-anchor="end" letter-spacing="0.1em">AIFLOXIUM</text>
</svg>