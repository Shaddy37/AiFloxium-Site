<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="white"/>
  <g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Title -->
    <text x="600" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#111" text-anchor="middle" letter-spacing="0.08em">MCP ECOSYSTEM — 38,000+ SERVERS, 80 THAT MATTER</text>
    
    <!-- Center: MCP Protocol -->
    <circle cx="600" cy="315" r="80" stroke-width="3" stroke="#f97316"/>
    <text x="600" y="310" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#f97316" text-anchor="middle">MCP</text>
    <text x="600" y="330" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Model Context</text>
    <text x="600" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Protocol</text>
    
    <!-- Left: MCP Clients -->
    <rect x="60" y="230" width="180" height="170" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="150" y="260" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#111" text-anchor="middle">MCP CLIENTS</text>
    <text x="150" y="285" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Claude Desktop</text>
    <text x="150" y="305" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Cursor</text>
    <text x="150" y="325" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Windsurf</text>
    <text x="150" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">ChatGPT</text>
    <text x="150" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Cline</text>
    <text x="150" y="385" font-family="system-ui, sans-serif" font-size="10" fill="#999" text-anchor="middle">+ 10 more</text>
    
    <!-- Connection line left -->
    <line x1="240" y1="315" x2="520" y2="315" stroke-width="1.5" stroke-dasharray="6,4"/>
    
    <!-- Right: Top Servers -->
    <rect x="960" y="120" width="180" height="200" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="1050" y="150" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#111" text-anchor="middle">TOP SERVERS</text>
    <text x="1050" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">#1 Playwright (82k)</text>
    <text x="1050" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">#2 Figma (74k)</text>
    <text x="1050" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">#3 GitHub (69k)</text>
    <text x="1050" y="235" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">#4 Jira (40k)</text>
    <text x="1050" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">#5 Context7</text>
    <text x="1050" y="275" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">#6 Sentry</text>
    <text x="1050" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">#7 Firecrawl</text>
    <text x="1050" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#999" text-anchor="middle">+ 83 more production</text>
    
    <!-- Connection line right -->
    <line x1="680" y1="315" x2="960" y2="315" stroke-width="1.5" stroke-dasharray="6,4"/>
    
    <!-- Bottom: Categories -->
    <rect x="120" y="480" width="140" height="55" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="190" y="505" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">DEV TOOLS</text>
    <text x="190" y="520" font-family="system-ui, sans-serif" font-size="9" fill="#999" text-anchor="middle">GitHub, Context7</text>
    
    <rect x="290" y="480" width="140" height="55" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="360" y="505" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BROWSER</text>
    <text x="360" y="520" font-family="system-ui, sans-serif" font-size="9" fill="#999" text-anchor="middle">Playwright, Puppeteer</text>
    
    <rect x="460" y="480" width="140" height="55" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="530" y="505" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">DATABASES</text>
    <text x="530" y="520" font-family="system-ui, sans-serif" font-size="9" fill="#999" text-anchor="middle">Postgres, Supabase</text>
    
    <rect x="630" y="480" width="140" height="55" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="700" y="505" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">SCRAPING</text>
    <text x="700" y="520" font-family="system-ui, sans-serif" font-size="9" fill="#999" text-anchor="middle">Firecrawl, Apify</text>
    
    <rect x="800" y="480" width="140" height="55" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="870" y="505" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">PRODUCTIVITY</text>
    <text x="870" y="520" font-family="system-ui, sans-serif" font-size="9" fill="#999" text-anchor="middle">Notion, Slack, Linear</text>
    
    <rect x="970" y="480" width="140" height="55" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="1040" y="505" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">DESIGN</text>
    <text x="1040" y="520" font-family="system-ui, sans-serif" font-size="9" fill="#999" text-anchor="middle">Figma, AIDesigner</text>
    
    <text x="600" y="600" font-family="system-ui, sans-serif" font-size="10" fill="#ccc" text-anchor="middle">AIFLOXIUM — MCP Server Ecosystem Map</text>
  </g>
</svg>