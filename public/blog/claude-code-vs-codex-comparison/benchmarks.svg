<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code vs Codex Benchmarks Comparison</title>
  <desc id="desc">Bar chart comparing performance scores between GPT-5.5 Codex and Claude Opus 4.7 across SWE-bench Verified, SWE-bench Pro, and Terminal-Bench 2.0.</desc>
  
  <!-- Background -->
  <rect width="1600" height="900" fill="#faf8f5"/>
  <rect x="30" y="30" width="1540" height="840" rx="36" fill="#ffffff" stroke="#e6e1da" stroke-width="2"/>
  
  <!-- Title and Legend -->
  <text x="80" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#1f2937">FRONTIEER CODING BENCHMARKS (2026)</text>
  <text x="80" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6b7280">Official evaluations showing performance across standard, novel, and terminal-agent tasks.</text>
  
  <!-- Legend Items -->
  <g transform="translate(1050, 95)">
    <!-- GPT-5.5 -->
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#0f766e"/>
    <text x="45" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#1f2937">GPT-5.5 (powers Codex)</text>
    
    <!-- Claude Opus 4.7 -->
    <rect x="0" y="50" width="30" height="30" rx="6" fill="#581c87"/>
    <text x="45" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#1f2937">Claude Opus 4.7 (Claude Code)</text>
  </g>
  
  <!-- Grid Lines (Y-Axis) -->
  <g transform="translate(150, 240)" stroke="#f3f4f6" stroke-width="1.5">
    <line x1="0" y1="0" x2="1300" y2="0"/>
    <line x1="0" y1="110" x2="1300" y2="110"/>
    <line x1="0" y1="220" x2="1300" y2="220"/>
    <line x1="0" y1="330" x2="1300" y2="330"/>
    <line x1="0" y1="440" x2="1300" y2="440"/>
    
    <!-- Y-Axis Labels -->
    <g font-family="monospace" font-size="16" font-weight="bold" fill="#9ca3af" stroke="none" text-anchor="end">
      <text x="-20" y="5">100%</text>
      <text x="-20" y="115">80%</text>
      <text x="-20" y="225">60%</text>
      <text x="-20" y="335">40%</text>
      <text x="-20" y="445">20%</text>
      <text x="-20" y="450" alignment-baseline="hanging">0%</text>
    </g>
  </g>
  
  <!-- Chart Border / Axes -->
  <line x1="150" y1="240" x2="150" y2="680" stroke="#d1d5db" stroke-width="2"/>
  <line x1="150" y1="680" x2="1450" y2="680" stroke="#d1d5db" stroke-width="2"/>
  
  <!-- BAR GROUPS -->
  
  <!-- Group 1: SWE-bench Verified (Standard Bug Fixes) -->
  <g transform="translate(230, 240)">
    <!-- GPT-5.5 Codex -->
    <!-- 88.7% of 440px height = 390.28px height. Y position = 440 - 390.28 = 49.72px -->
    <rect x="0" y="49.7" width="90" height="390.3" rx="10" fill="#0f766e" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <text x="45" y="30" text-anchor="middle" font-family="monospace" font-size="20" font-weight="900" fill="#0f766e">88.7%</text>
    
    <!-- Claude Opus 4.7 -->
    <!-- 87.6% of 440px height = 385.44px height. Y position = 440 - 385.44 = 54.56px -->
    <rect x="110" y="54.6" width="90" height="385.4" rx="10" fill="#581c87" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <text x="155" y="35" text-anchor="middle" font-family="monospace" font-size="20" font-weight="900" fill="#581c87">87.6%</text>
    
    <!-- Title / Label -->
    <text x="100" y="490" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1f2937">SWE-bench Verified</text>
    <text x="100" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#6b7280">Standard bug fixing benchmarks</text>
  </g>
  
  <!-- Group 2: SWE-bench Pro (Hard / Novel Reasoning) -->
  <g transform="translate(630, 240)">
    <!-- GPT-5.5 Codex -->
    <!-- 58.6% of 440px height = 257.84px height. Y position = 440 - 257.84 = 182.16px -->
    <rect x="0" y="182.2" width="90" height="257.8" rx="10" fill="#0f766e" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <text x="45" y="160" text-anchor="middle" font-family="monospace" font-size="20" font-weight="900" fill="#0f766e">58.6%</text>
    
    <!-- Claude Opus 4.7 -->
    <!-- 64.3% of 440px height = 282.92px height. Y position = 440 - 282.92 = 157.08px -->
    <rect x="110" y="157.1" width="90" height="282.9" rx="10" fill="#581c87" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <text x="155" y="135" text-anchor="middle" font-family="monospace" font-size="20" font-weight="900" fill="#581c87">64.3%</text>
    
    <!-- Title / Label -->
    <text x="100" y="490" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1f2937">SWE-bench Pro</text>
    <text x="100" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#6b7280">Harder problems, novel codebases</text>
  </g>
  
  <!-- Group 3: Terminal-Bench 2.0 (Terminal Execution) -->
  <g transform="translate(1030, 240)">
    <!-- GPT-5.5 Codex -->
    <!-- 82.7% of 440px height = 363.88px height. Y position = 440 - 363.88 = 76.12px -->
    <rect x="0" y="76.1" width="90" height="363.9" rx="10" fill="#0f766e" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <text x="45" y="55" text-anchor="middle" font-family="monospace" font-size="20" font-weight="900" fill="#0f766e">82.7%</text>
    
    <!-- Claude Opus 4.7 -->
    <!-- 69.4% of 440px height = 305.36px height. Y position = 440 - 305.36 = 134.64px -->
    <rect x="110" y="134.6" width="90" height="305.4" rx="10" fill="#581c87" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <text x="155" y="112" text-anchor="middle" font-family="monospace" font-size="20" font-weight="900" fill="#581c87">69.4%</text>
    
    <!-- Title / Label -->
    <text x="100" y="490" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1f2937">Terminal-Bench 2.0</text>
    <text x="100" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#6b7280">Shell scripting &amp; command tasks</text>
  </g>
  
  <!-- Explanatory Footnote Banner -->
  <rect x="80" y="805" width="1440" height="40" rx="8" fill="#f8fafc"/>
  <text x="100" y="830" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" font-style="italic">Source: OpenAI official GPT-5.5 Launch Disclosures &amp; Morph LLM database (May 2026).</text>
</svg>
