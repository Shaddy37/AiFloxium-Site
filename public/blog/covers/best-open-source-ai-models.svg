      <stop offset="0%" stop-color="#0a0915"/>
      <stop offset="50%" stop-color="#1b1226"/>
      <stop offset="100%" stop-color="#3d1d28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle decorative ambient glows -->
