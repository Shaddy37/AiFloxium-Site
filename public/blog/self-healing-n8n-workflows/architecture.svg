<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="white"/>
  <g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Title -->
    <text x="600" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#111" text-anchor="middle" letter-spacing="0.08em">5-LAYER SELF-HEALING ARCHITECTURE</text>
    
    <!-- Layer 1 -->
    <rect x="100" y="80" width="1000" height="70" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="140" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f97316">LAYER 1</text>
    <text x="220" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">IDEMPOTENCY GUARD</text>
    <text x="700" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#666">Block duplicate processing before any side effect happens</text>
    <text x="1050" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#f97316" text-anchor="end" font-weight="700">ROI: HIGHEST</text>
    
    <!-- Layer 2 -->
    <rect x="100" y="165" width="1000" height="70" rx="10" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
    <text x="140" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111">LAYER 2</text>
    <text x="220" y="195" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">SMART RETRIES</text>
    <text x="700" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#666">Exponential backoff + jitter for transient failures</text>
    <text x="1050" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#999" text-anchor="end">Backoff: 1s → 60s cap</text>
    
    <!-- Layer 3 -->
    <rect x="100" y="250" width="1000" height="70" rx="10" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
    <text x="140" y="280" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111">LAYER 3</text>
    <text x="220" y="280" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">COMPENSATING ACTIONS</text>
    <text x="700" y="280" font-family="system-ui, sans-serif" font-size="11" fill="#666">Rollback partial work when a step permanently fails</text>
    <text x="1050" y="280" font-family="system-ui, sans-serif" font-size="11" fill="#999" text-anchor="end">Undo side effects in reverse</text>
    
    <!-- Layer 4 -->
    <rect x="100" y="335" width="1000" height="70" rx="10" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
    <text x="140" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111">LAYER 4</text>
    <text x="220" y="365" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">DEAD-LETTER QUEUE</text>
    <text x="700" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#666">Quarantine bad records so the pipeline keeps moving</text>
    <text x="1050" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#999" text-anchor="end">DLQ + scheduled reprocess</text>
    
    <!-- Layer 5 -->
    <rect x="100" y="420" width="1000" height="70" rx="10" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>
    <text x="140" y="450" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111">LAYER 5</text>
    <text x="220" y="450" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">OBSERVABILITY + ALERTING</text>
    <text x="700" y="450" font-family="system-ui, sans-serif" font-size="11" fill="#666">Heartbeats, structured logs, error budgets, Slack alerts</text>
    <text x="1050" y="450" font-family="system-ui, sans-serif" font-size="11" fill="#999" text-anchor="end">Budget: 0.5% failure rate</text>
    
    <!-- Bottom: Status codes -->
    <rect x="100" y="520" width="1000" height="60" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="200" y="545" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111">5xx: RETRY</text>
    <text x="350" y="545" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111">429: BACKOFF</text>
    <text x="500" y="545" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111">401: REFRESH</text>
    <text x="650" y="545" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111">422: DLQ</text>
    <text x="800" y="545" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111">404: FAIL FAST</text>
    <text x="1000" y="545" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111">STALL: ALERT</text>
    
    <text x="600" y="610" font-family="system-ui, sans-serif" font-size="10" fill="#ccc" text-anchor="middle">AIFLOXIUM — Self-Healing n8n Workflow Architecture</text>
  </g>
</svg>