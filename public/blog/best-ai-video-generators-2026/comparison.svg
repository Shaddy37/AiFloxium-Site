<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="white"/>
  <g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Title -->
    <text x="600" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#111" text-anchor="middle" letter-spacing="0.08em">TOP AI VIDEO GENERATORS — 2026 RANKING</text>
    
    <!-- #1 Veo 3.1 -->
    <rect x="80" y="80" width="340" height="90" rx="10" fill="#fafafa" stroke="#ec4899" stroke-width="3"/>
    <text x="100" y="110" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#ec4899">#1</text>
    <text x="150" y="108" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">Google Veo 3.1</text>
    <text x="150" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#666">Native audio | ~$2.50/10s</text>
    <text x="150" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#999">Best overall, cinematic realism</text>
    
    <!-- #2 Kling 3.0 -->
    <rect x="440" y="80" width="340" height="90" rx="10" fill="#fafafa" stroke="#111" stroke-width="2"/>
    <text x="460" y="110" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#111">#2</text>
    <text x="510" y="108" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">Kling 3.0</text>
    <text x="510" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#666">Best value | ~$0.50/10s</text>
    <text x="510" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#999">Cheapest credible 1080p clips</text>
    
    <!-- #3 Sora 2 -->
    <rect x="800" y="80" width="340" height="90" rx="10" fill="#fafafa" stroke="#111" stroke-width="2"/>
    <text x="820" y="110" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#111">#3</text>
    <text x="870" y="108" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">Sora 2</text>
    <text x="870" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#666">Best motion — sunsetting</text>
    <text x="870" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#999">Don't build on it</text>
    
    <!-- #4 Runway Gen-4.5 -->
    <rect x="80" y="200" width="340" height="90" rx="10" fill="#fafafa" stroke="#111" stroke-width="2"/>
    <text x="100" y="230" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#111">#4</text>
    <text x="150" y="228" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">Runway Gen-4.5</text>
    <text x="150" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#666">Pro tooling | From ~$15/mo</text>
    <text x="150" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#999">Keyframes, motion brushes</text>
    
    <!-- #5 HeyGen -->
    <rect x="440" y="200" width="340" height="90" rx="10" fill="#fafafa" stroke="#111" stroke-width="2"/>
    <text x="460" y="230" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#111">#5</text>
    <text x="510" y="228" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">HeyGen</text>
    <text x="510" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#666">Talking-head | Free/paid</text>
    <text x="510" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#999">Avatars, dubbing, Video Agent</text>
    
    <!-- #6 Luma Dream Machine -->
    <rect x="800" y="200" width="340" height="90" rx="10" fill="#fafafa" stroke="#111" stroke-width="2"/>
    <text x="820" y="230" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#111">#6</text>
    <text x="870" y="228" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">Luma Dream Machine</text>
    <text x="870" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#666">Fast + cinematic | Credits</text>
    <text x="870" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#999">Speed, keyframes, social B-roll</text>
    
    <!-- Bottom: Decision Matrix -->
    <rect x="80" y="340" width="1060" height="200" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="610" y="370" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111" text-anchor="middle">QUICK DECISION MATRIX</text>
    
    <text x="130" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST CINEMATIC</text>
    <text x="130" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#ec4899" text-anchor="middle" font-weight="700">Veo 3.1</text>
    
    <text x="320" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST VALUE</text>
    <text x="320" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">Kling 3.0</text>
    
    <text x="510" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST PRO TOOLING</text>
    <text x="510" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">Runway Gen-4.5</text>
    
    <text x="700" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST TALKING-HEAD</text>
    <text x="700" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">HeyGen</text>
    
    <text x="890" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST FAST CLIPS</text>
    <text x="890" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">Luma Dream Machine</text>
    
    <text x="240" y="460" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST CAMERA MOTION</text>
    <text x="240" y="480" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">Higgsfield</text>
    
    <text x="430" y="460" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST OPEN</text>
    <text x="430" y="480" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">Seedance / Wan 2.6</text>
    
    <text x="620" y="460" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST MOTION</text>
    <text x="620" y="480" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">Sora 2 (sunsetting)</text>
    
    <text x="600" y="520" font-family="system-ui, sans-serif" font-size="10" fill="#999" text-anchor="middle">Don't anchor your workflow to Sora 2 — migrate to Veo or Kling</text>
    
    <text x="600" y="600" font-family="system-ui, sans-serif" font-size="10" fill="#ccc" text-anchor="middle">AIFLOXIUM — AI Video Generators Ranking 2026</text>
