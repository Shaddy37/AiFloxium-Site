<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1722"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="g-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4905e"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
    <linearGradient id="g-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d5a8e"/>
    </linearGradient>
    <linearGradient id="g-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a6a"/>
      <stop offset="100%" stop-color="#3d8a8a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle background circles -->
  <circle cx="200" cy="200" r="250" fill="#1e3a5f" opacity="0.04"/>
  <circle cx="1000" cy="500" r="300" fill="#2d6a6a" opacity="0.03"/>

  <!-- Label -->
  <text x="60" y="55" font-family="monospace" font-size="11" fill="#c4905e" opacity="0.6" letter-spacing="4">02</text>
  <text x="100" y="55" font-family="sans-serif" font-size="11" fill="#64748b" opacity="0.8" letter-spacing="3">HEADSHOT GENERATION PROCESS // FROM SELFIES TO STUDIO</text>

  <!-- Flow: Step 1 - Upload -->
  <rect x="80" y="120" width="200" height="120" rx="16" fill="rgba(30,58,95,0.4)" stroke="#2d5a8e" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="180" cy="155" r="28" fill="rgba(196,144,94,0.12)" stroke="#c4905e" stroke-width="1"/>
  <text x="180" y="162" font-family="sans-serif" font-size="20" fill="#c4905e" text-anchor="middle" font-weight="bold">📸</text>
  <text x="180" y="200" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">1. Upload Selfies</text>
  <text x="180" y="220" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">4-15 varied photos</text>

  <!-- Arrow 1 -->
  <line x1="280" y1="180" x2="360" y2="180" stroke="#c4905e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <polygon points="355,174 365,180 355,186" fill="#c4905e" opacity="0.5"/>

  <!-- Step 2 - Train -->
  <rect x="370" y="120" width="200" height="120" rx="16" fill="rgba(45,106,106,0.2)" stroke="#3d8a8a" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="470" cy="155" r="28" fill="rgba(45,106,106,0.12)" stroke="#3d8a8a" stroke-width="1"/>
  <text x="470" y="162" font-family="sans-serif" font-size="20" fill="#3d8a8a" text-anchor="middle" font-weight="bold">⚙️</text>
  <text x="470" y="200" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">2. AI Training</text>
  <text x="470" y="220" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Face model built</text>

  <!-- Arrow 2 -->
  <line x1="570" y1="180" x2="650" y2="180" stroke="#c4905e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <polygon points="645,174 655,180 645,186" fill="#c4905e" opacity="0.5"/>

  <!-- Step 3 - Generate -->
  <rect x="660" y="120" width="200" height="120" rx="16" fill="rgba(196,144,94,0.08)" stroke="#c4905e" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="760" cy="155" r="28" fill="rgba(196,144,94,0.12)" stroke="#c4905e" stroke-width="1"/>
  <text x="760" y="162" font-family="sans-serif" font-size="20" fill="#c4905e" text-anchor="middle" font-weight="bold">✨</text>
  <text x="760" y="200" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">3. Generate</text>
  <text x="760" y="220" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">10-45 min turnaround</text>

  <!-- Arrow 3 -->
  <line x1="860" y1="180" x2="940" y2="180" stroke="#c4905e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <polygon points="935,174 945,180 935,186" fill="#c4905e" opacity="0.5"/>

  <!-- Step 4 - Select -->
  <rect x="950" y="120" width="200" height="120" rx="16" fill="rgba(30,58,95,0.4)" stroke="#2d5a8e" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="1050" cy="155" r="28" fill="rgba(196,144,94,0.12)" stroke="#c4905e" stroke-width="1"/>
  <text x="1050" y="162" font-family="sans-serif" font-size="20" fill="#c4905e" text-anchor="middle" font-weight="bold">✅</text>
  <text x="1050" y="200" font-family="sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="bold">4. Select &amp; Use</text>
  <text x="1050" y="220" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">LinkedIn, resume, team</text>

  <!-- Horizontal process bar -->
  <rect x="80" y="260" width="1070" height="2" rx="1" fill="#c4905e" opacity="0.1"/>

  <!-- Tips section -->
  <rect x="80" y="300" width="530" height="170" rx="16" fill="rgba(30,58,95,0.2)" stroke="#2d5a8e" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="110" y="335" font-family="sans-serif" font-size="13" fill="#c4905e" font-weight="bold" letter-spacing="1">TIPS FOR BEST RESULTS</text>
  <text x="110" y="365" font-family="sans-serif" font-size="11" fill="#94a3b8">• Use varied angles &amp; lighting in your selfies</text>
  <text x="110" y="390" font-family="sans-serif" font-size="11" fill="#94a3b8">• Avoid group photos &amp; heavy filters</text>
  <text x="110" y="415" font-family="sans-serif" font-size="11" fill="#94a3b8">• Choose tools with good data-deletion policies</text>
  <text x="110" y="440" font-family="sans-serif" font-size="11" fill="#94a3b8">• Download &amp; request deletion after generating</text>

  <!-- Watch out section -->
  <rect x="640" y="300" width="520" height="170" rx="16" fill="rgba(45,106,106,0.08)" stroke="#3d8a8a" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="670" y="335" font-family="sans-serif" font-size="13" fill="#c4905e" font-weight="bold" letter-spacing="1">WATCH OUT FOR</text>
  <text x="670" y="365" font-family="sans-serif" font-size="11" fill="#94a3b8">• "Five cousins" problem — inconsistent likeness</text>
  <text x="670" y="390" font-family="sans-serif" font-size="11" fill="#94a3b8">• Skin tone shifting / whitewashing</text>
  <text x="670" y="415" font-family="sans-serif" font-size="11" fill="#94a3b8">• Refund policies vary — read the fine print</text>
  <text x="670" y="440" font-family="sans-serif" font-size="11" fill="#94a3b8">• Privacy: prefer tools with clear deletion timelines</text>

  <!-- Stats footer -->
  <rect x="80" y="500" width="1070" height="120" rx="20" fill="rgba(196,144,94,0.04)" stroke="#c4905e" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Stat 1 -->
  <text x="160" y="545" font-family="sans-serif" font-size="28" fill="#c4905e" text-anchor="middle" font-weight="bold">$250+</text>
  <text x="160" y="570" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle" letter-spacing="1">AVG STUDIO SESSION</text>

  <text x="430" y="545" font-family="sans-serif" font-size="28" fill="#3d8a8a" text-anchor="middle" font-weight="bold">~$29</text>
  <text x="430" y="570" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle" letter-spacing="1">BEST VALUE AI</text>

  <text x="700" y="545" font-family="sans-serif" font-size="28" fill="#c4905e" text-anchor="middle" font-weight="bold">4-15</text>
  <text x="700" y="570" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle" letter-spacing="1">SELFIES NEEDED</text>

  <text x="970" y="545" font-family="sans-serif" font-size="28" fill="#3d8a8a" text-anchor="middle" font-weight="bold">8</text>
  <text x="970" y="570" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle" letter-spacing="1">TOOLS RANKED</text>

  <!-- Divider lines between stats -->
  <line x1="320" y1="520" x2="320" y2="600" stroke="#c4905e" stroke-width="0.5" opacity="0.15"/>
  <line x1="590" y1="520" x2="590" y2="600" stroke="#c4905e" stroke-width="0.5" opacity="0.15"/>
  <line x1="860" y1="520" x2="860" y2="600" stroke="#c4905e" stroke-width="0.5" opacity="0.15"/>
</svg>