<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0015"/>
      <stop offset="100%" stop-color="#1f0033"/>
    </linearGradient>
    <linearGradient id="g-creator" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="g-agent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="g-scale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="g-dev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" rx="32"/>
  <text x="80" y="80" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="bold" letter-spacing="-0.5">AI Voice by Use Case — 2026</text>
  <text x="80" y="115" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="16">Match your project type to the right TTS tool — quality, latency, scale, or control.</text>

  <!-- Column 1: Creator -->
  <rect x="60" y="150" width="270" height="460" rx="20" fill="#f59e0b" fill-opacity="0.06" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="60" y="150" width="270" height="60" rx="20" fill="url(#g-creator)" fill-opacity="0.15"/>
  <text x="195" y="185" fill="#fbbf24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CREATOR &amp; NARRATION</text>
  <text x="80" y="245" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">BEST CHOICE</text>
  <text x="80" y="270" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ElevenLabs</text>
  <text x="80" y="300" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">YouTube voiceovers,</text>
  <text x="80" y="318" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">podcasts, audiobooks,</text>
  <text x="80" y="336" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">multilingual dubbing.</text>
  <line x1="80" y1="360" x2="310" y2="360" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1"/>
  <text x="80" y="385" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="12" font-weight="bold">ALSO GOOD</text>
  <text x="80" y="408" fill="#fff" font-family="Arial, sans-serif" font-size="14">Play.ht (voice variety)</text>
  <text x="80" y="428" fill="#fff" font-family="Arial, sans-serif" font-size="14">WellSaid (enterprise)</text>
  <text x="80" y="448" fill="#fff" font-family="Arial, sans-serif" font-size="14">Speechify (accessibility)</text>

  <!-- Column 2: Agent -->
  <rect x="350" y="150" width="270" height="460" rx="20" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="350" y="150" width="270" height="60" rx="20" fill="url(#g-agent)" fill-opacity="0.15"/>
  <text x="485" y="185" fill="#a855f7" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">VOICE AGENTS &amp; GAMES</text>
  <text x="370" y="245" fill="#7c3aed" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">BEST CHOICE</text>
  <text x="370" y="270" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Inworld</text>
  <text x="370" y="300" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">Conversational AI, live</text>
  <text x="370" y="318" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">game NPCs, real-time</text>
  <text x="370" y="336" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">voice assistants.</text>
  <line x1="370" y1="360" x2="600" y2="360" stroke="#7c3aed" stroke-opacity="0.15" stroke-width="1"/>
  <text x="370" y="385" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="12" font-weight="bold">ALSO GOOD</text>
  <text x="370" y="408" fill="#fff" font-family="Arial, sans-serif" font-size="14">Cartesia Sonic 3</text>
  <text x="370" y="428" fill="#fff" font-family="Arial, sans-serif" font-size="14">ElevenLabs Flash</text>

  <!-- Column 3: Scale -->
  <rect x="640" y="150" width="270" height="460" rx="20" fill="#06b6d4" fill-opacity="0.06" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="640" y="150" width="270" height="60" rx="20" fill="url(#g-scale)" fill-opacity="0.15"/>
  <text x="775" y="185" fill="#22d3ee" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">HIGH-VOLUME &amp; BUDGET</text>
  <text x="660" y="245" fill="#06b6d4" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">BEST CHOICE</text>
  <text x="660" y="270" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Amazon Polly</text>
  <text x="660" y="300" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">App TTS, IVR systems,</text>
  <text x="660" y="318" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">high-volume content,</text>
  <text x="660" y="336" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">AWS-native pipelines.</text>
  <line x1="660" y1="360" x2="890" y2="360" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1"/>
  <text x="660" y="385" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="12" font-weight="bold">ALSO GOOD</text>
  <text x="660" y="408" fill="#fff" font-family="Arial, sans-serif" font-size="14">ElevenLabs (quality)</text>
  <text x="660" y="428" fill="#fff" font-family="Arial, sans-serif" font-size="14">Inworld (agent scale)</text>

  <!-- Column 4: Dev -->
  <rect x="930" y="150" width="210" height="460" rx="20" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="930" y="150" width="210" height="60" rx="20" fill="url(#g-dev)" fill-opacity="0.15"/>
  <text x="1035" y="185" fill="#34d399" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">OPEN-SOURCE</text>
  <text x="950" y="245" fill="#10b981" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">BEST CHOICE</text>
  <text x="950" y="270" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Chatterbox</text>
  <text x="950" y="290" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Coqui XTTS</text>
  <text x="950" y="310" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">OpenVoice</text>
  <text x="950" y="340" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="12">Self-hosted cloning,</text>
  <text x="950" y="358" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="12">zero per-use cost,</text>
  <text x="950" y="376" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="12">full control.</text>
  <line x1="950" y1="396" x2="1120" y2="396" stroke="#10b981" stroke-opacity="0.15" stroke-width="1"/>
  <text x="950" y="420" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="11" font-weight="bold">NEEDS GPU</text>
  <text x="950" y="442" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="11">24GB+ VRAM</text>
  <text x="950" y="460" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="11">recommended</text>
</svg>
