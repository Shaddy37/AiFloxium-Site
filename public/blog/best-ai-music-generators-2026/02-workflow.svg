<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0015"/>
      <stop offset="100%" stop-color="#120020"/>
    </linearGradient>
    <linearGradient id="g-step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="g-step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="g-step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="g-step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" rx="32"/>
  
  <text x="80" y="80" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="bold" letter-spacing="-0.5">AI Music Creation Workflow</text>
  <text x="80" y="115" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="16">From text prompt to production-ready track in four steps.</text>

  <!-- Step 1 -->
  <rect x="80" y="160" width="240" height="80" rx="16" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="200" y="198" fill="#f472b6" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">STEP 01</text>
  <text x="200" y="225" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Describe Your Track</text>
  <text x="80" y="265" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">Write a prompt with genre, mood, tempo,</text>
  <text x="80" y="285" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">instruments, and optional custom lyrics.</text>

  <!-- Arrow -->
  <line x1="340" y1="200" x2="380" y2="200" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5"/>
  <polygon points="385,200 375,193 375,207" fill="#fff" fill-opacity="0.2"/>

  <!-- Step 2 -->
  <rect x="400" y="160" width="240" height="80" rx="16" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="520" y="198" fill="#c084fc" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">STEP 02</text>
  <text x="520" y="225" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">AI Generates Draft</text>
  <text x="400" y="265" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">Tool produces 2-4 variants from your</text>
  <text x="400" y="285" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">prompt with vocals, melody, and mix.</text>

  <!-- Arrow -->
  <line x1="660" y1="200" x2="700" y2="200" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5"/>
  <polygon points="705,200 695,193 695,207" fill="#fff" fill-opacity="0.2"/>

  <!-- Step 3 -->
  <rect x="720" y="160" width="240" height="80" rx="16" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="840" y="198" fill="#22d3ee" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">STEP 03</text>
  <text x="840" y="225" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Edit &amp; Refine</text>
  <text x="720" y="265" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">Inpaint parts, extend, adjust structure</text>
  <text x="720" y="285" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="13">with timeline editing and stem export.</text>

  <!-- Arrow -->
  <line x1="980" y1="200" x2="1020" y2="200" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5"/>
  <polygon points="1025,200 1015,193 1015,207" fill="#fff" fill-opacity="0.2"/>

  <!-- Step 4 -->
  <rect x="1040" y="160" width="100" height="80" rx="16" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="1090" y="198" fill="#fbbf24" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" text-anchor="middle">STEP 04</text>
  <text x="1090" y="225" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Export</text>
  <rect x="1055" y="248" width="70" height="20" rx="10" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="1090" y="262" fill="#fbbf24" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">WAV / MP3</text>

  <!-- Bottom: Licensing note -->
  <rect x="200" y="380" width="800" height="60" rx="30" fill="#f472b6" fill-opacity="0.06" stroke="#f472b6" stroke-opacity="0.15" stroke-width="1"/>
  <text x="600" y="408" fill="#f472b6" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1" text-anchor="middle">BEFORE YOU PUBLISH: Verify commercial rights on your current plan</text>
  <text x="600" y="426" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Free tiers usually grant no commercial use. Paid plans unlock it.</text>

  <!-- Right side notes -->
  <g transform="translate(150, 480)">
    <rect x="0" y="0" width="320" height="140" rx="16" fill="#fff" fill-opacity="0.03" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
    <text x="160" y="35" fill="#ec4899" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">~30s</text>
    <text x="160" y="60" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Time to First Draft</text>
    <text x="160" y="90" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">From prompt to first listen</text>
    <text x="160" y="110" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">in under a minute.</text>
  </g>

  <g transform="translate(530, 480)">
    <rect x="0" y="0" width="320" height="140" rx="16" fill="#fff" fill-opacity="0.03" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
    <text x="160" y="35" fill="#06b6d4" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">~$10/mo</text>
    <text x="160" y="60" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Pro Tier Entry Point</text>
    <text x="160" y="90" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Most tools start around $10/mo</text>
    <text x="160" y="110" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">for commercial rights and stems.</text>
  </g>
</svg>
