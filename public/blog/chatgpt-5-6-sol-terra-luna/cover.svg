<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0606"/>
      <stop offset="50%" stop-color="#140C0C"/>
      <stop offset="100%" stop-color="#221212"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow spheres -->
  <circle cx="200" cy="300" r="300" fill="#EF4444" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1400" cy="600" r="250" fill="#F59E0B" opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="800" cy="150" r="200" fill="#EF4444" opacity="0.05" filter="url(#softGlow)"/>

  <!-- Grid lines -->
  <g opacity="0.03">
    <line x1="0" y1="300" x2="1600" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1600" y2="600" stroke="white" stroke-width="0.5"/>
    <line x1="533" y1="0" x2="533" y2="900" stroke="white" stroke-width="0.5"/>
    <line x1="1066" y1="0" x2="1066" y2="900" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Orbits and celestial shapes representing Sol, Terra, Luna -->
  <g opacity="0.25" transform="translate(150, 420)">
    <circle cx="0" cy="0" r="40" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
    <circle cx="60" cy="-30" r="10" fill="#F59E0B" opacity="0.8"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  <g opacity="0.15" transform="translate(1420, 260)">
    <circle cx="0" cy="0" r="30" stroke="#EF4444" stroke-width="1.5" fill="none"/>
    <circle cx="-40" cy="20" r="8" fill="#EF4444" opacity="0.6"/>
  </g>

  <!-- Central geometric model solar system metaphor -->
  <g transform="translate(800, 360)" filter="url(#glow)">
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="140" ry="50" stroke="url(#accent2)" stroke-width="1" opacity="0.3" fill="none" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="100" ry="35" stroke="url(#accent1)" stroke-width="0.5" opacity="0.2" fill="none" transform="rotate(-15)"/>

    <!-- Sol (Sun) - Flagship center -->
    <circle cx="0" cy="0" r="45" fill="url(#accent1)"/>
    <circle cx="0" cy="0" r="45" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>

    <!-- Terra (Earth) - Balanced middle -->
    <g transform="translate(90, -25)">
      <circle cx="0" cy="0" r="16" fill="#F59E0B"/>
      <circle cx="0" cy="0" r="16" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- Luna (Moon) - Fast edge -->
    <g transform="translate(-130, 35)">
      <circle cx="0" cy="0" r="10" fill="#B91C1C"/>
      <circle cx="0" cy="0" r="10" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
    </g>
  </g>

  <!-- Title text -->
  <text x="800" y="580" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1.5">GPT-5.6 Sol, Terra &amp; Luna</text>
  <text x="800" y="635" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#A1A1AA" letter-spacing="4" font-weight="500">OPENAI'S NEW THREE-MODEL FAMILY</text>

  <!-- Accent bottom separators -->
  <line x1="300" y1="680" x2="1300" y2="680" stroke="url(#accent2)" stroke-width="2" opacity="0.4"/>
  <line x1="500" y1="685" x2="1100" y2="685" stroke="url(#accent1)" stroke-width="1" opacity="0.2"/>

  <!-- Subtitle/Tools list -->
  <text x="800" y="730" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#52525B" letter-spacing="3">FRONTIER REASONING · BALANCED EVERYDAY · HIGH-VOLUME ROUTING</text>
  <text x="800" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3F3F46" letter-spacing="2">GPT-LIVE VOICE · CHATGPT WORK AGENT · PROGRAMMATIC TOOL CALLING</text>

  <!-- Bottom right badge -->
  <g transform="translate(1400, 820)">
    <text text-anchor="end" font-family="monospace" font-size="10" fill="#52525B" letter-spacing="1">GA · JULY 9, 2026</text>
  </g>

  <!-- Decorative nodes -->
  <circle cx="150" cy="150" r="2" fill="#EF4444" opacity="0.3"/>
  <circle cx="1450" cy="150" r="1.5" fill="#F59E0B" opacity="0.2"/>
  <circle cx="750" cy="820" r="1.5" fill="#EF4444" opacity="0.2"/>
</svg>
