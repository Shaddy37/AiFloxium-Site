<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="white"/>
  <g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Title -->
    <text x="600" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#111" text-anchor="middle" letter-spacing="0.08em">TOP AI SEARCH ENGINES — 2026 RANKING</text>
    
    <!-- #1 Perplexity -->
    <rect x="80" y="80" width="340" height="90" rx="10" fill="#fafafa" stroke="#6366f1" stroke-width="3"/>
    <text x="100" y="110" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#6366f1">#1</text>
    <text x="150" y="108" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">Perplexity</text>
    <text x="150" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#666">Citations + accuracy | Free/$20/$200</text>
    <text x="150" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#999">Best overall, ~92% factual accuracy</text>
    
    <!-- #2 Google AI Mode -->
    <rect x="440" y="80" width="340" height="90" rx="10" fill="#fafafa" stroke="#111" stroke-width="2"/>
    <text x="460" y="110" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#111">#2</text>
    <text x="510" y="108" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">Google AI Mode</text>
    <text x="510" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#666">Biggest index | Free</text>
    <text x="510" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#999">Best Google replacement</text>
    
    <!-- #3 ChatGPT Search -->
    <rect x="800" y="80" width="340" height="90" rx="10" fill="#fafafa" stroke="#111" stroke-width="2"/>
    <text x="820" y="110" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#111">#3</text>
    <text x="870" y="108" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">ChatGPT Search</text>
    <text x="870" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#666">All-in-one | Free/$20/$200</text>
    <text x="870" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#999">Search + generation in one place</text>
    
    <!-- #4 Copilot -->
    <rect x="80" y="200" width="340" height="90" rx="10" fill="#fafafa" stroke="#111" stroke-width="2"/>
    <text x="100" y="230" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#111">#4</text>
    <text x="150" y="228" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">Microsoft Copilot</text>
    <text x="150" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#666">Office integration | Free/paid</text>
    <text x="150" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#999">Best for Microsoft users</text>
    
    <!-- #5 Gemini -->
    <rect x="440" y="200" width="340" height="90" rx="10" fill="#fafafa" stroke="#111" stroke-width="2"/>
    <text x="460" y="230" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#111">#5</text>
    <text x="510" y="228" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">Gemini</text>
    <text x="510" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#666">Multimodal | Free/paid</text>
    <text x="510" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#999">Best for creators & multimodal</text>
    
    <!-- #6 Phind -->
    <rect x="800" y="200" width="340" height="90" rx="10" fill="#fafafa" stroke="#111" stroke-width="2"/>
    <text x="820" y="230" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#111">#6</text>
    <text x="870" y="228" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">Phind</text>
    <text x="870" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#666">Developer focus | Free/paid</text>
    <text x="870" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#999">Best for developers</text>
    
    <!-- Bottom: Decision Matrix -->
    <rect x="80" y="340" width="1060" height="200" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="610" y="370" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111" text-anchor="middle">QUICK DECISION MATRIX</text>
    
    <text x="140" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST RESEARCH</text>
    <text x="140" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#6366f1" text-anchor="middle" font-weight="700">Perplexity</text>
    
    <text x="330" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST GOOGLE REPLACEMENT</text>
    <text x="330" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">Google AI Mode</text>
    
    <text x="520" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST ALL-IN-ONE</text>
    <text x="520" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">ChatGPT Search</text>
    
    <text x="710" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST OFFICE</text>
    <text x="710" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">Copilot</text>
    
    <text x="900" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST CREATORS</text>
    <text x="900" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">Gemini</text>
    
    <text x="240" y="460" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST DEVELOPERS</text>
    <text x="240" y="480" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">Phind</text>
    
    <text x="430" y="460" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST PRIVACY</text>
    <text x="430" y="480" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">DuckDuckGo</text>
    
    <text x="620" y="460" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST TRENDS</text>
    <text x="620" y="480" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">Grok</text>
    
    <text x="810" y="460" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">BEST FLEXIBLE</text>
    <text x="810" y="480" font-family="system-ui, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="700">You.com / Brave</text>
    
    <text x="600" y="520" font-family="system-ui, sans-serif" font-size="10" fill="#999" text-anchor="middle">Most pros keep 2: Perplexity to find, ChatGPT to create</text>
    
    <text x="600" y="600" font-family="system-ui, sans-serif" font-size="10" fill="#ccc" text-anchor="middle">AIFLOXIUM — AI Search Engines Ranking 2026</text>
