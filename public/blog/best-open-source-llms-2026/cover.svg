<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a040f"/>
      <stop offset="50%" stop-color="#190526"/>
      <stop offset="100%" stop-color="#0c021f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle decorative ambient glows (Magenta, Purple, Cyan) -->
  <circle cx="150" cy="150" r="280" fill="#ec4899" fill-opacity="0.08" filter="blur(70px)"/>
  <circle cx="1050" cy="480" r="250" fill="#a855f7" fill-opacity="0.07" filter="blur(60px)"/>
  <circle cx="600" cy="315" r="200" fill="#06b6d4" fill-opacity="0.05" filter="blur(55px)"/>

  <!-- Main border card container -->
  <rect x="72" y="74" width="1056" height="482" rx="42" fill="#000000" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Eyebrow Tag -->
  <text x="118" y="148" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="4">AIFLOXIUM / OPEN-SOURCE LLMS</text>
  
  <!-- Main Title -->
  <text x="118" y="248" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="-0.02em">Best Open-Source</text>
  <text x="118" y="318" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="-0.02em">LLMs in 2026:</text>
  <text x="118" y="388" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="-0.02em">The Honest Ranking</text>
  
  <!-- Sub-headlines / Supporting Details -->
  <text x="118" y="452" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.01em">DeepSeek V4 · GLM-5 · Qwen 3.6 · Kimi K2.5 · Llama 4</text>
  <text x="118" y="500" fill="#ffffff" fill-opacity="0.75" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Hands-on local benchmarks, hardware configurations, and license breakdowns.</text>
