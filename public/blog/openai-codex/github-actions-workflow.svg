<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actions workflow illustration</title>
  <desc id="desc">2D editorial illustration of a GitHub Actions automation workflow with cron trigger, data update, deployment, and QA steps.</desc>
  <rect width="1600" height="900" fill="#f7efe8"/>
  <rect x="140" y="120" width="1320" height="660" rx="36" fill="#ffffff"/>
  <text x="190" y="200" font-family="Georgia, serif" font-size="52" fill="#211532">Weekly GitHub Actions Workflow</text>
  <rect x="190" y="270" width="220" height="90" rx="24" fill="#221533"/>
  <text x="235" y="325" font-family="Arial, sans-serif" font-size="28" fill="#ffffff">Cron Trigger</text>
  <rect x="490" y="270" width="220" height="90" rx="24" fill="#d6c3ec"/>
  <text x="525" y="325" font-family="Arial, sans-serif" font-size="28" fill="#241533">Pull Comments</text>
  <rect x="790" y="270" width="220" height="90" rx="24" fill="#8fd3ff"/>
  <text x="835" y="325" font-family="Arial, sans-serif" font-size="28" fill="#241533">Build Data</text>
  <rect x="1090" y="270" width="220" height="90" rx="24" fill="#ef8d54"/>
  <text x="1135" y="325" font-family="Arial, sans-serif" font-size="28" fill="#ffffff">Deploy</text>
  <path d="M410 315h70M710 315h70M1010 315h70" stroke="#241533" stroke-width="8" stroke-linecap="round"/>
  <path d="M460 288l26 27-26 27M760 288l26 27-26 27M1060 288l26 27-26 27" fill="none" stroke="#241533" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="490" y="470" width="520" height="180" rx="30" fill="#24172f"/>
  <text x="550" y="540" font-family="Courier New, monospace" font-size="28" fill="#8fd3ff">0 7 * * 1</text>
  <text x="550" y="590" font-family="Courier New, monospace" font-size="24" fill="#d9c8ea">run analyzer → commit data → deploy → QA</text>
  <text x="550" y="635" font-family="Courier New, monospace" font-size="24" fill="#ef8d54">notify team when workflow completes</text>
</svg>
