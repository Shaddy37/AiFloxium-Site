<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YouTube API environment setup illustration</title>
  <desc id="desc">2D editorial illustration of terminal output and environment setup for a YouTube API key stored in a .env file.</desc>
  <rect width="1600" height="900" fill="#f9f3eb"/>
  <rect x="120" y="110" width="1360" height="680" rx="34" fill="#16111f"/>
  <rect x="120" y="110" width="1360" height="88" rx="34" fill="#221533"/>
  <circle cx="190" cy="154" r="12" fill="#ff7f6b"/>
  <circle cx="230" cy="154" r="12" fill="#f5be5a"/>
  <circle cx="270" cy="154" r="12" fill="#62d595"/>
  <text x="350" y="165" font-family="Arial, sans-serif" font-size="28" fill="#f6efe7">terminal / project setup</text>
  <rect x="190" y="250" width="500" height="300" rx="28" fill="#24172f"/>
  <text x="230" y="315" font-family="Courier New, monospace" font-size="30" fill="#8fd3ff">.env</text>
  <text x="230" y="380" font-family="Courier New, monospace" font-size="34" fill="#ef8d54">YOUTUBE_API_KEY=••••••••••</text>
  <text x="230" y="440" font-family="Courier New, monospace" font-size="26" fill="#d5c4e6">Stored locally, not in chat</text>
  <rect x="760" y="250" width="520" height="300" rx="28" fill="#fffaf6"/>
  <text x="810" y="320" font-family="Georgia, serif" font-size="38" fill="#241533">Connection Checklist</text>
  <rect x="810" y="370" width="18" height="18" rx="9" fill="#62d595"/>
  <text x="850" y="386" font-family="Arial, sans-serif" font-size="28" fill="#241533">Enable YouTube Data API v3</text>
  <rect x="810" y="430" width="18" height="18" rx="9" fill="#62d595"/>
  <text x="850" y="446" font-family="Arial, sans-serif" font-size="28" fill="#241533">Create API key in Google Cloud</text>
  <rect x="810" y="490" width="18" height="18" rx="9" fill="#62d595"/>
  <text x="850" y="506" font-family="Arial, sans-serif" font-size="28" fill="#241533">Test comment retrieval in Codex</text>
  <path d="M690 402h70" stroke="#ef8d54" stroke-width="8" stroke-linecap="round"/>
  <path d="M730 368l40 34-40 34" fill="none" stroke="#ef8d54" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
