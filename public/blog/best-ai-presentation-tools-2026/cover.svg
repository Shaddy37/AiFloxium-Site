<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0F"/>
      <stop offset="50%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#10192A"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow spheres -->
  <circle cx="200" cy="300" r="300" fill="#10B981" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1400" cy="600" r="250" fill="#06B6D4" opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="800" cy="150" r="200" fill="#10B981" opacity="0.05" filter="url(#softGlow)"/>

  <!-- Geometric grid lines for tech blueprint theme -->
  <g opacity="0.04">
    <line x1="0" y1="300" x2="1600" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1600" y2="600" stroke="white" stroke-width="0.5"/>
    <line x1="533" y1="0" x2="533" y2="900" stroke="white" stroke-width="0.5"/>
    <line x1="1066" y1="0" x2="1066" y2="900" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Presentation / Slide motif - abstract cards -->
  <g opacity="0.15" transform="translate(150, 420)">
    <rect x="-40" y="-30" width="120" height="80" rx="8" stroke="#06B6D4" stroke-width="1.5" fill="none"/>
    <line x1="-20" y1="-10" x2="40" y2="-10" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="10" x2="60" y2="10" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-20" y1="25" x2="20" y2="25" stroke="#06B6D4" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g opacity="0.12" transform="translate(1420, 260)">
    <rect x="-30" y="-20" width="100" height="70" rx="6" stroke="#10B981" stroke-width="1" fill="none"/>
    <line x1="-15" y1="-5" x2="45" y2="-5" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-15" y1="10" x2="35" y2="10" stroke="#10B981" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Central geometric projector beam symbol -->
  <g transform="translate(800, 360)" filter="url(#glow)">
    <!-- Concentric circle rings representing projector lens -->
    <circle cx="0" cy="0" r="130" stroke="url(#accent2)" stroke-width="1" opacity="0.25" fill="none"/>
    <circle cx="0" cy="0" r="110" stroke="url(#accent1)" stroke-width="0.5" opacity="0.15" fill="none"/>

    <!-- Dynamic slide layout paths -->
    <rect x="-60" y="-40" width="120" height="80" rx="6" stroke="url(#accent1)" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M-60 10 L-20 -10 L20 15 L60 -5" stroke="url(#accent2)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sparkles/Data Nodes -->
    <circle cx="-20" cy="-10" r="4.5" fill="#06B6D4"/>
    <circle cx="20" cy="15" r="4.5" fill="#10B981"/>
    <circle cx="-60" cy="-40" r="3" fill="#06B6D4"/>
    <circle cx="60" cy="40" r="3" fill="#10B981"/>
  </g>

  <!-- Title text -->
  <text x="800" y="580" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1.5">Best AI Presentation Tools</text>
  <text x="800" y="635" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#A1A1AA" letter-spacing="4" font-weight="500">THE 2026 ULTIMATE RANKING</text>

  <!-- Accent bottom separators -->
  <line x1="300" y1="680" x2="1300" y2="680" stroke="url(#accent2)" stroke-width="2" opacity="0.4"/>
  <line x1="500" y1="685" x2="1100" y2="685" stroke="url(#accent1)" stroke-width="1" opacity="0.2"/>

  <!-- Subtitle/Tools list -->
  <text x="800" y="730" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#52525B" letter-spacing="3">GAMMA · CANVA · PLUS AI · BEAUTIFUL.AI · COPILOT</text>
  <text x="800" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3F3F46" letter-spacing="2">PITCH · PRESENTATIONS.AI · PREZI · SLIDESAI</text>

  <!-- Bottom right badge -->
  <g transform="translate(1400, 820)">
    <text text-anchor="end" font-family="monospace" font-size="10" fill="#52525B" letter-spacing="1">UPDATED · JULY 2026</text>
  </g>

  <!-- Decorative nodes -->
  <circle cx="150" cy="150" r="2" fill="#10B981" opacity="0.3"/>
  <circle cx="1450" cy="150" r="1.5" fill="#06B6D4" opacity="0.2"/>
  <circle cx="750" cy="820" r="1.5" fill="#10B981" opacity="0.2"/>
</svg>
