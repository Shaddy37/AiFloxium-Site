<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0C0A"/>
      <stop offset="50%" stop-color="#181410"/>
      <stop offset="100%" stop-color="#241810"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow spheres -->
  <circle cx="200" cy="300" r="300" fill="#F59E0B" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1400" cy="600" r="250" fill="#0D9488" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="800" cy="150" r="200" fill="#F59E0B" opacity="0.05" filter="url(#softGlow)"/>

  <!-- Waveform lines (note-taking audio visual motif) -->
  <path d="M50 650 Q100 550 150 650 Q200 750 250 650 Q300 550 350 650 Q400 750 450 650 Q500 550 550 650 Q600 750 650 650" stroke="url(#accent1)" stroke-width="2" opacity="0.15" fill="none"/>
  <path d="M100 700 Q150 600 200 700 Q250 800 300 700 Q350 600 400 700 Q450 800 500 700 Q550 600 600 700 Q650 800 700 700" stroke="url(#accent2)" stroke-width="1.5" opacity="0.1" fill="none"/>

  <!-- Floating note/transcript bubbles -->
  <g opacity="0.3">
    <rect x="120" y="180" width="80" height="60" rx="8" stroke="#F59E0B" stroke-width="1" fill="none"/>
    <line x1="135" y1="200" x2="185" y2="200" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="135" y1="210" x2="175" y2="210" stroke="#F59E0B" stroke-width="1" stroke-linecap="round"/>
    <line x1="135" y1="220" x2="170" y2="220" stroke="#F59E0B" stroke-width="0.5" stroke-linecap="round"/>
  </g>
  <g opacity="0.2">
    <rect x="1380" y="200" width="60" height="50" rx="6" stroke="#0D9488" stroke-width="1" fill="none"/>
    <line x1="1395" y1="215" x2="1425" y2="215" stroke="#0D9488" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1395" y1="225" x2="1420" y2="225" stroke="#0D9488" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Central geometric symbol - abstract "brain/notes" icon -->
  <g transform="translate(800, 380)" filter="url(#glow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="140" stroke="url(#accent2)" stroke-width="1" opacity="0.3" fill="none"/>
    <circle cx="0" cy="0" r="130" stroke="url(#accent2)" stroke-width="0.5" opacity="0.15" fill="none"/>

    <!-- Inner triangle/waveform symbol -->
    <path d="M-60 40 L0 -50 L60 40" stroke="url(#accent1)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-40 60 L0 -20 L40 60" stroke="url(#accent2)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dots at vertices -->
    <circle cx="0" cy="-50" r="5" fill="#F59E0B"/>
    <circle cx="-60" cy="40" r="4" fill="#0D9488"/>
    <circle cx="60" cy="40" r="4" fill="#F59E0B"/>
  </g>

  <!-- Grid lines -->
  <g opacity="0.03">
    <line x1="0" y1="300" x2="1600" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1600" y2="600" stroke="white" stroke-width="0.5"/>
    <line x1="533" y1="0" x2="533" y2="900" stroke="white" stroke-width="0.5"/>
    <line x1="1066" y1="0" x2="1066" y2="900" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Mic/voice visual element -->
  <g transform="translate(200, 420)" opacity="0.12">
    <rect x="-8" y="-20" width="16" height="25" rx="8" stroke="white" stroke-width="2" fill="none"/>
    <line x1="0" y1="5" x2="0" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M-12 8 Q-12 25 0 25 Q12 25 12 8" stroke="white" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Title text -->
  <text x="800" y="580" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1.5">Best AI Note-Taking Apps</text>
  <text x="800" y="635" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#A1A1AA" letter-spacing="4" font-weight="500">THE 2026 ULTIMATE RANKING</text>

  <!-- Bottom accent bar -->
  <line x1="300" y1="680" x2="1300" y2="680" stroke="url(#accent1)" stroke-width="2" opacity="0.4"/>
  <line x1="500" y1="685" x2="1100" y2="685" stroke="url(#accent2)" stroke-width="1" opacity="0.2"/>

  <!-- Subtitle/tools names -->
  <text x="800" y="730" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#52525B" letter-spacing="3">GRANOLA · FATHOM · OTTER · FIREFLIES · NOTION AI</text>
  <text x="800" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3F3F46" letter-spacing="2">TL;DV · AVOMA · CONVO · MORE</text>

  <!-- Bottom right badge -->
  <g transform="translate(1400, 820)">
    <text text-anchor="end" font-family="monospace" font-size="10" fill="#52525B" letter-spacing="1">UPDATED · JULY 2026</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="150" cy="150" r="2" fill="#F59E0B" opacity="0.3"/>
  <circle cx="1450" cy="150" r="1.5" fill="#0D9488" opacity="0.2"/>
  <circle cx="750" cy="820" r="1.5" fill="#0D9488" opacity="0.2"/>
  <circle cx="900" cy="830" r="2" fill="#F59E0B" opacity="0.15"/>
</svg>
