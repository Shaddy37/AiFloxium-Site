<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="0" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="0.5"/>
  </g>
  
  <!-- Radial glow -->
  <circle cx="900" cy="300" r="400" fill="url(#glow)"/>
  
  <!-- Category label -->
  <rect x="120" y="120" width="220" height="28" rx="4" fill="url(#accent)"/>
  <text x="135" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="0.15em">AI CODING COMPARISON</text>
  
  <!-- Main headline -->
  <text x="120" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-0.03em">Best AI Coding</text>
  <text x="120" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-0.03em">Agents 2026</text>
  
  <!-- Supporting line -->
  <text x="120" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#a1a1aa" letter-spacing="0.02em">12 tools tested. 3 you actually need.</text>
  
  <!-- Ranking badge -->
  <g transform="translate(950, 140)">
    <circle cx="80" cy="80" r="75" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <text x="80" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">#1</text>
    <text x="80" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle">Claude Code</text>
  </g>
  
  <!-- Key tools -->
  <g transform="translate(120, 400)">
    <rect x="0" y="0" width="140" height="55" rx="8" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="70" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">Claude Code</text>
    <text x="70" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#71717a" text-anchor="middle">88.6% SWE</text>
  </g>
  
  <g transform="translate(280, 400)">
    <rect x="0" y="0" width="140" height="55" rx="8" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="70" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">Cursor</text>
    <text x="70" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#71717a" text-anchor="middle">Best IDE</text>
  </g>
  
  <g transform="translate(440, 400)">
    <rect x="0" y="0" width="140" height="55" rx="8" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="70" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">Codex</text>
    <text x="70" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#71717a" text-anchor="middle">Parallel agents</text>
  </g>
  
  <g transform="translate(600, 400)">
    <rect x="0" y="0" width="140" height="55" rx="8" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="70" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">Copilot</text>
    <text x="70" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#71717a" text-anchor="middle">Enterprise</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="120" y="530" width="100" height="3" rx="1.5" fill="url(#accent)"/>
  
  <!-- Brand watermark -->
  <text x="1080" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="white" fill-opacity="0.3" text-anchor="end" letter-spacing="0.1em">AIFLOXIUM</text>
</svg>